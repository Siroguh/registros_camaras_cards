name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - name: Check tag and package
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version)process.exit(1)'
      - run: pnpm check
      - run: git diff --exit-code -- registros-camaras-cards.js
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: images
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cards
          path: dist/registros-camaras-cards.js
          if-no-files-found: error
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: cards
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/registros-camaras-cards.js --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
